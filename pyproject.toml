[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-content-agents"
version = "0.1.0"
description = "Local MVP for a 4-agent blog writing pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "pydantic>=2.6.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
content-agents = "content_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
